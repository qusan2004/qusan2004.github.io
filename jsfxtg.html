<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九上历史复习提纲 · 交互式复习</title>
<style>
  :root{
    --bg:#f5f0e6; --card:#fffdf7; --ink:#3b3225; --sub:#8a7d68;
    --accent:#8b5e3c; --accent2:#a0774e; --line:#e4d9c6;
    --done:#4a7c59; --todo:#b04a3a; --hl:#f6e7c9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.75;
  }
  .app{display:flex; min-height:100vh;}

  .sidebar{
    width:300px; background:#fffaf0; border-right:1px solid var(--line);
    padding:20px 16px; position:sticky; top:0; height:100vh; overflow-y:auto; flex-shrink:0;
  }
  .sidebar h1{font-size:20px; color:var(--accent); margin-bottom:4px;}
  .sidebar .subtitle{font-size:12px; color:var(--sub); margin-bottom:18px;}
  .search-box{width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:8px; background:#fff; font-size:14px; margin-bottom:16px;}
  .search-box:focus{outline:2px solid var(--accent2);}
  .nav-section{margin-bottom:10px;}
  .nav-section > .sec-head{
    font-weight:bold; font-size:14px; color:var(--accent); cursor:pointer;
    padding:8px 6px; border-radius:6px; display:flex; justify-content:space-between;
    align-items:center; user-select:none;
  }
  .nav-section > .sec-head:hover{background:var(--hl);}
  .nav-section .sec-items{display:none; padding-left:10px;}
  .nav-section.open .sec-items{display:block;}
  .nav-section .sec-head .arrow{transition:transform .2s; font-size:11px;}
  .nav-section.open .sec-head .arrow{transform:rotate(90deg);}
  .nav-item{padding:7px 10px; font-size:13px; cursor:pointer; border-radius:6px; color:var(--ink);}
  .nav-item:hover{background:var(--hl);}
  .nav-item.active{background:var(--accent); color:#fff;}
  .nav-item .tag{font-size:14px; margin-left:6px; color:var(--sub);}
  .nav-item.active .tag{color:#f0e2cf;}

  /* 单元分组：整组折叠（一行：箭头折叠，文字进卡片） */
  .unit-group{margin:2px 0;}
  .unit-group .unit-head{
    font-size:13px; font-weight:bold; color:var(--accent);
    padding:7px 10px; border-radius:6px;
    display:flex; align-items:center; gap:5px; user-select:none;
  }
  .unit-group .unit-head .arrow{
    cursor:pointer; transition:transform .2s; font-size:11px; padding:2px 4px;
  }
  .unit-group .unit-head .arrow:hover{background:var(--hl); border-radius:4px;}
  .unit-group:not(.unit-collapsed) .unit-head .arrow{transform:rotate(90deg);}
  .unit-group .unit-head .u-title{cursor:pointer; flex:1; padding:2px 4px;}
  .unit-group .unit-head .u-title:hover{background:var(--hl); border-radius:4px;}
  .unit-group .unit-head.active{background:var(--accent); color:#fff;}
  .unit-group .unit-head.active .tag{color:#f0e2cf;}
  .unit-group .unit-items{padding-left:14px; border-left:2px solid var(--line); margin-left:10px;}
  .unit-group .unit-items .nav-item{font-size:12.5px; padding:6px 10px;}
  .unit-group.unit-collapsed .unit-items{display:none;}

  .progress-box{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:6px;}
  .progress-box h3{font-size:13px; color:var(--accent); margin-bottom:8px;}
  .progress-bar{height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin-bottom:6px;}
  .progress-fill{height:100%; width:0%; background:var(--done); transition:width .4s;}
  .progress-text{font-size:12px; color:var(--sub);}

  /* 挖空控制区 */
  .fill-controls{background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:14px; margin-top:6px;}
  .fill-controls h3{font-size:13px; color:var(--accent); margin-bottom:10px;}
  .fc-btn{width:100%; padding:9px 0; margin-bottom:8px; border:none; border-radius:8px;
    cursor:pointer; font-size:13px; color:#fff; background:var(--accent2); transition:background .2s;}
  .fc-btn:hover{background:var(--accent);}
  .fc-btn:last-child{margin-bottom:0;}
  .fc-btn.primary{background:var(--accent);}
  .fc-btn.primary:hover{background:var(--accent2);}
  .fc-btn.alt{background:var(--todo);}
  .fc-btn.alt:hover{background:#8a3a2c;}
  .fc-hint{font-size:11px; color:var(--sub); margin-top:10px; line-height:1.6;}

  .main{flex:1; padding:30px 40px 60px; max-width:1100px; margin:0 auto;}
  .page-title{font-size:28px; color:var(--accent); border-bottom:3px solid var(--accent2); padding-bottom:10px; margin-bottom:8px;}
  .page-sub{font-size:13px; color:var(--sub); margin-bottom:26px;}
  .section{display:none;}
  .section.active{display:block; animation:fade .3s;}
  @keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  .sec-banner{background:var(--accent); color:#fff; border-radius:10px; padding:16px 20px; margin-bottom:20px;}
  .sec-banner h2{font-size:20px;}
  .sec-banner p{font-size:12px; opacity:.9; margin-top:4px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 20px; margin-bottom:16px; transition:box-shadow .2s; position:relative;}
  .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.06);}
  .card.done{background:#f1f7f2; border-color:#cfe3d2;}
  .card.done::after{content:"✓"; position:absolute; top:14px; right:16px; color:var(--done); font-size:20px; font-weight:bold;}
  .card h3{font-size:17px; color:var(--accent); margin-bottom:10px; padding-right:40px;}
  .card ul{list-style:none;}
  .card li{padding:5px 0 5px 22px; position:relative; font-size:14.5px;}
  .card li::before{content:"▸"; position:absolute; left:4px; color:var(--accent2);}
  .card li strong{color:var(--accent);}
  .card .quote{background:var(--hl); border-left:4px solid var(--accent2); padding:10px 14px;
    border-radius:0 6px 6px 0; margin:8px 0; font-size:14px; color:#5a4d38; list-style:none;}
  .card .quote::before{content:"";}
  .mark-btn{margin-top:12px; padding:6px 14px; border:none; border-radius:6px; cursor:pointer;
    background:var(--accent2); color:#fff; font-size:13px; transition:background .2s;}
  .mark-btn:hover{background:var(--accent);}
  .card.done .mark-btn{background:var(--todo);}

  /* 原位挖空 */
  .blank{color:var(--accent); font-weight:bold; background:var(--hl); border-bottom:2px solid var(--accent2);
    padding:0 5px; border-radius:3px; margin:0 2px; display:inline-block;}
  .blank.hidden{color:transparent; background:repeating-linear-gradient(45deg,#f6e7c9,#f6e7c9 6px,#efdfbc 6px,#efdfbc 12px);
    border-bottom:2px dashed var(--accent2); user-select:none;}
  .ans-btn{display:inline-block; margin-left:4px; padding:1px 7px; font-size:11px; cursor:pointer;
    background:var(--accent2); color:#fff; border:none; border-radius:4px; vertical-align:middle;}
  .ans-btn:hover{background:var(--accent);}

  /* 让图片适应知识点卡片宽度 */
  .kp-img { max-width: 100%; height: auto; border-radius: 6px; margin: 8px auto; display: block; }

  /* 自测题样式 */
  .quiz{padding-top:14px; border-top:1px dashed var(--line); margin-top:14px;}
  .quiz-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .quiz-head h3{font-size:16px; color:var(--accent); margin:0;}
  .quiz-btn{background:var(--accent); color:#fff; border:none; padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px;}
  .quiz-btn:hover{background:var(--accent2);}
  .quiz-img { max-width: 100%; height: auto; border-radius: 6px; margin: 8px auto; display: block; }
  .quiz-score{font-size:14px; font-weight:bold; color:var(--accent); margin-bottom:12px; display:none;}
  .q-item{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:13px 16px; margin-bottom:12px;}
  .q-item .q{font-size:14.5px; margin-bottom:10px;}
  .opt{display:block; padding:8px 12px; border:1px solid var(--line); border-radius:8px;
    margin-bottom:6px; cursor:pointer; font-size:13.5px; transition:background .15s;}
  .opt:hover{background:var(--hl);}
  .opt.selected{background:var(--accent2); color:#fff; border-color:var(--accent2);}
  .opt.correct{background:var(--done); color:#fff; border-color:var(--done);}
  .opt.wrong{background:var(--todo); color:#fff; border-color:var(--todo);}
  .q-result{font-size:13px; margin-top:8px; font-weight:bold; display:none;}
  .q-result.right{color:var(--done);}
  .q-result.wrong{color:var(--todo);}

  @media(max-width:800px){
    .app{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:static;}
    .main{padding:20px;}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <h1>📜 九上历史复习提纲</h1>
    <div class="subtitle">常熟市实验中学历史组 · 中考复习资料</div>
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 搜索知识点…" autocomplete="off">

    <div id="nav"></div>
    <div class="progress-box">
      <h3>📊 复习进度</h3>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">已掌握 0 / 0</div>
    </div>

    <div class="fill-controls">
      <h3>✏️ 挖空练习</h3>
      <button class="fc-btn primary" id="btnStart">开始挖空练习</button>
      <button class="fc-btn" id="btnReveal">显示全部答案</button>
      <button class="fc-btn alt" id="btnRestore">恢复原文</button>
      <div class="fc-hint">作用于当前打开的全部知识点卡片</div>
    </div>
  </aside>

  <main class="main">
    <h1 class="page-title">九年级上册 · 世界历史复习提纲</h1>
    <p class="page-sub">世界古代史 · 世界近代史｜掌握社会形态特点与重大事件影响，构建时空框架，理解制度变革与思想解放的内在联系</p>
    <div id="content"></div>
  </main>
</div>

/* ========== 渲染 ========== */
var navEl = document.getElementById("nav");
var contentEl = document.getElementById("content");

// 生成导航（单元 → 子知识点 二级结构，自动识别整百单元，单元标题只显示一行）
data.forEach(function(sec){
  var wrap=document.createElement("div"); wrap.className="nav-section";
  var head=document.createElement("div"); head.className="sec-head";
  head.innerHTML='<span>'+sec.title+'</span><span class="arrow">▶</span>';
  head.setAttribute("data-secid", sec.id);
  head.onclick=function(){ wrap.classList.toggle("open"); };

  var items=document.createElement("div"); items.className="sec-items";

  var unitWrap=null;

  sec.items.forEach(function(it){
    var isUnit = it.id.length>=3 && it.id.slice(-2)==="00";

    if(isUnit){
      unitWrap=document.createElement("div"); unitWrap.className="unit-group";
      unitWrap.setAttribute("data-unit", it.id);

      // 单元标题：一行。箭头折叠，文字进卡片
      var un=document.createElement("div"); un.className="unit-head nav-item";
      un.setAttribute("data-secid", sec.id);
      un.setAttribute("data-itemid", it.id);

      var arrow=document.createElement("span"); arrow.className="arrow"; arrow.textContent="▸";
      var title=document.createElement("span"); title.className="u-title";
      title.innerHTML=it.title+'<span class="tag">'+it.id+'</span>';

      // 点箭头：折叠/展开整组
      arrow.onclick=function(e){
        e.stopPropagation();
        this.parentElement.classList.toggle("unit-collapsed");
      };
      // 点标题文字：进入该单元知识点卡片
      title.onclick=function(e){
        e.stopPropagation();
        openSection(sec.id, it.id);
      };

      un.appendChild(arrow);
      un.appendChild(title);
      unitWrap.appendChild(un);

      var sub=document.createElement("div"); sub.className="unit-items";
      sub.setAttribute("data-unit", it.id);
      unitWrap.appendChild(sub);
      items.appendChild(unitWrap);
    } else {
      var n=document.createElement("div"); n.className="nav-item sub-item";
      n.innerHTML=it.title+'<span class="tag">'+it.id+'</span>';
      n.setAttribute("data-secid", sec.id);
      n.setAttribute("data-itemid", it.id);
      n.onclick=function(){ openSection(sec.id, it.id); };
      if(unitWrap){
        unitWrap.querySelector(".unit-items").appendChild(n);
      } else {
        items.appendChild(n);
      }
    }
  });

  wrap.appendChild(head); wrap.appendChild(items);
  navEl.appendChild(wrap);
});

// 生成内容
data.forEach(function(sec){
  var secDiv=document.createElement("div"); secDiv.className="section"; secDiv.id="sec-"+sec.id;

  var banner=document.createElement("div"); banner.className="sec-banner";
  banner.innerHTML='<h2>'+sec.title+'</h2><p>'+(sec.sub||"")+'</p>';
  secDiv.appendChild(banner);

  sec.items.forEach(function(it){
    var card=document.createElement("div"); card.className="card";
    card.id="card-"+it.id;
    card.setAttribute("data-itemid", it.id);

    var h3=document.createElement("h3"); h3.innerHTML=it.id+" · "+it.title;
    card.appendChild(h3);

    var ul=document.createElement("ul");
    var blankCount=0;
    it.kp.forEach(function(k){
      var li=document.createElement("li");
      if(typeof k==="object"){
        li.className="quote"; li.innerHTML=k.quote;
      }else{
        li.innerHTML=renderInlineBlanks(k);
        blankCount += countBlanks(k);
      }
      ul.appendChild(li);
    });
    card.appendChild(ul);

    if(quizzes[it.id]){
      card.appendChild(buildQuiz(it.id));
    }

    var mark=document.createElement("button"); mark.className="mark-btn"; mark.textContent="标记为已掌握";
    mark.setAttribute("data-id", it.id);
    mark.onclick=function(){ toggleDone(it.id, mark); };
    card.appendChild(mark);

    secDiv.appendChild(card);
  });
  contentEl.appendChild(secDiv);
});

/* ========== 原位挖空渲染 ========== */
function renderInlineBlanks(text){
  return text.replace(/<strong>(.*?)<\/strong>/g, function(match, content){
    return '<span class="blank">'+content+'</span><button class="ans-btn" data-ans="'+content.replace(/"/g,'&quot;')+'">答案</button>';
  });
}
function countBlanks(text){
  var m=text.match(/<strong>/g);
  return m ? m.length : 0;
}

/* ========== 自测题构建 ========== */
function buildQuiz(id){
  var qs=quizzes[id];
  var box=document.createElement("div"); box.className="quiz";

  var head=document.createElement("div"); head.className="quiz-head";
  head.innerHTML='<h3>📝 知识点自测</h3>';
  var btn=document.createElement("button"); btn.className="quiz-btn";
  btn.textContent="提交答案";
  btn.setAttribute("data-id", id);
  head.appendChild(btn);
  box.appendChild(head);

  var score=document.createElement("div"); score.className="quiz-score"; score.id="score-"+id;
  box.appendChild(score);

  qs.forEach(function(q,qi){
    var item=document.createElement("div"); item.className="q-item";
    item.innerHTML='<div class="q">'+(qi+1)+'. '+q[0]+'</div>';
    for(var i=1;i<=4;i++){
      var opt=document.createElement("label"); opt.className="opt";
      opt.setAttribute("data-id", id);
      opt.setAttribute("data-q", qi);
      opt.setAttribute("data-opt", i-1);
      opt.textContent=q[i];
      item.appendChild(opt);
    }
    var r=document.createElement("div"); r.className="q-result";
    r.setAttribute("data-id", id);
    r.setAttribute("data-r", qi);
    item.appendChild(r);
    box.appendChild(item);
  });
  return box;
}

/* ========== 挖空控制（当前章节） ========== */
function getActiveCards(){
  var active=document.querySelector(".section.active");
  if(active){ return active.querySelectorAll(".card"); }
  return document.querySelectorAll(".card");
}
function startPractice(){
  var cards=getActiveCards();
  for(var i=0;i<cards.length;i++){
    var blanks=cards[i].querySelectorAll(".blank");
    for(var j=0;j<blanks.length;j++){ blanks[j].classList.add("hidden"); }
  }
}
function revealAll(){
  var cards=getActiveCards();
  for(var i=0;i<cards.length;i++){
    var blanks=cards[i].querySelectorAll(".blank");
    for(var j=0;j<blanks.length;j++){ blanks[j].classList.remove("hidden"); }
  }
}
function restoreText(){ revealAll(); }

document.getElementById("btnStart").addEventListener("click", startPractice);
document.getElementById("btnReveal").addEventListener("click", revealAll);
document.getElementById("btnRestore").addEventListener("click", restoreText);

/* ========== 全局事件委托 ========== */
document.addEventListener("click", function(e){
  var t=e.target;
  if(!t || !t.classList) return;

  if(t.classList.contains("ans-btn")){
    var blank=t.previousElementSibling;
    if(blank && blank.classList.contains("blank")){ blank.classList.remove("hidden"); }
    return;
  }
  if(t.classList.contains("opt")){
    var id=t.getAttribute("data-id"), qi=t.getAttribute("data-q");
    var opts=document.querySelectorAll('.opt[data-id="'+id+'"][data-q="'+qi+'"]');
    for(var i=0;i<opts.length;i++){ opts[i].classList.remove("selected"); }
    t.classList.add("selected");
    return;
  }
  if(t.classList.contains("quiz-btn")){
    checkQuiz(t.getAttribute("data-id"));
  }
});

/* ========== 判分 ========== */
function checkQuiz(id){
  var qs=quizzes[id];
  var score=0;
  qs.forEach(function(q,qi){
    var opts=document.querySelectorAll('.opt[data-id="'+id+'"][data-q="'+qi+'"]');
    var correct=q[5];
    for(var i=0;i<opts.length;i++){
      opts[i].classList.remove("correct","wrong");
      if(parseInt(opts[i].getAttribute("data-opt"))===correct) opts[i].classList.add("correct");
    }
    var selected=document.querySelector('.opt[data-id="'+id+'"][data-q="'+qi+'"].selected');
    var r=document.querySelector('.q-result[data-id="'+id+'"][data-r="'+qi+'"]');
    r.style.display="block";
    if(selected && parseInt(selected.getAttribute("data-opt"))===correct){
      r.textContent="✅ 回答正确！"; r.className="q-result right"; score++;
    }else{
      r.textContent="❌ 错误，正确答案："+q[correct+1]; r.className="q-result wrong";
    }
  });
  var scoreEl=document.getElementById("score-"+id);
  scoreEl.style.display="block";
  scoreEl.textContent="得分："+score+" / "+qs.length;
}

/* ========== 打开章节 ========== */
function openSection(secId, itemId){
  var sections=document.querySelectorAll(".section");
  for(var i=0;i<sections.length;i++){ sections[i].classList.remove("active"); }
  var target=document.getElementById("sec-"+secId);
  target.classList.add("active");

  var navItems=document.querySelectorAll(".nav-item");
  for(var j=0;j<navItems.length;j++){
    navItems[j].classList.remove("active");
    if(navItems[j].getAttribute("data-itemid")===itemId){
      navItems[j].classList.add("active");
      var parent=navItems[j].closest(".nav-section");
      if(parent){ parent.classList.add("open"); }
    }
  }
  var card=document.getElementById("card-"+itemId);
  if(card){ card.scrollIntoView({behavior:"smooth", block:"start"}); }
}

/* ========== 标记完成 ========== */
function toggleDone(id, btn){
  var card=document.getElementById("card-"+id);
  card.classList.toggle("done");
  btn.textContent = card.classList.contains("done") ? "标记为需复习" : "标记为已掌握";
  updateProgress();
}
function updateProgress(){
  var cards=document.querySelectorAll(".card");
  var total=cards.length, done=0;
  for(var i=0;i<total;i++){ if(cards[i].classList.contains("done")) done++; }
  document.getElementById("progressFill").style.width=(done/total*100)+"%";
  document.getElementById("progressText").textContent="已掌握 "+done+" / "+total;
}
updateProgress();

/* ========== 搜索 ========== */
var searchBox=document.getElementById("searchBox");
searchBox.addEventListener("input", function(){
  var q=this.value.trim().toLowerCase();
  var sections=document.querySelectorAll(".section");
  var cards=document.querySelectorAll(".card");
  var navItems=document.querySelectorAll(".nav-item");

  if(!q){
    for(var i=0;i<sections.length;i++){ sections[i].style.display=""; sections[i].classList.remove("active"); }
    for(var j=0;j<cards.length;j++){ cards[j].style.display=""; }
    for(var k=0;k<navItems.length;k++){ navItems[k].style.display=""; }
    if(sections.length>0){ sections[0].classList.add("active"); }
    return;
  }

  for(var m=0;m<cards.length;m++){
    var card=cards[m];
    var match=card.textContent.toLowerCase().indexOf(q)>-1 || card.id.toLowerCase().indexOf(q)>-1;
    card.style.display = match ? "" : "none";
  }
  for(var n=0;n<sections.length;n++){
    var sec=sections[n];
    var visible=hasVisibleCard(sec);
    sec.style.display = visible ? "" : "none";
    sec.classList.toggle("active", visible);
  }
  for(var p=0;p<navItems.length;p++){
    var id=navItems[p].getAttribute("data-itemid");
    var c=document.getElementById("card-"+id);
    navItems[p].style.display = (c && c.style.display!=="none") ? "" : "none";
  }
});
function hasVisibleCard(sec){
  var cards=sec.querySelectorAll(".card");
  for(var i=0;i<cards.length;i++){ if(cards[i].style.display!=="none") return true; }
  return false;
}

if(document.querySelectorAll(".section").length>0){
  document.querySelectorAll(".section")[0].classList.add("active");
}
</script>
