<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 大屈老师的历史小站</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --border:#e4e8f0;
    --text:#1f2a44; --muted:#7b8499;
    --primary:#4a7df0; --primary-soft:#eef3ff;
    --radius:14px; --shadow:0 2px 10px rgba(31,42,68,.06);
    --shadow-hover:0 8px 24px rgba(31,42,68,.12);
    /* 通知栏配色变量（可自行调整） */
    --notice-bg:#fff7e6; --notice-border:#ffd591;
    --notice-accent:#ffa940; --notice-title:#ad4e00; --notice-text:#5c3a10;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; padding:48px 24px 64px;
  }
  /* 页头 */
  .hero{ text-align:center; margin-bottom:40px; }
  .hero h1{ font-size:30px; font-weight:700; letter-spacing:1px; }
  .hero p{ color:var(--muted); margin-top:10px; font-size:15px; }
  .hero .badge{
    display:inline-block; margin-top:14px; padding:6px 16px;
    background:var(--primary-soft); color:var(--primary);
    border-radius:999px; font-size:13px; font-weight:600;
  }

  /* ========== 新增：通知栏（布置作业 / 发布公告） ========== */
  .notice{
    max-width:1080px; margin:0 auto 24px;
    background:var(--notice-bg);
    border:1px solid var(--notice-border);
    border-left:5px solid var(--notice-accent);
    border-radius:var(--radius);
    padding:16px 20px;
    box-shadow:var(--shadow);
  }
  .notice .notice-head{
    display:flex; align-items:center; gap:8px;
    font-size:20px; font-weight:700; color:var(--notice-title);
    margin-bottom:10px;
  }
  .notice .notice-head::before{ content:"📢"; }
  .notice ul{ list-style:none; }
  .notice li{
    font-size:18px; line-height:1.75; color:var(--notice-text);
    padding-left:18px; position:relative;
  }
  .notice li::before{
    content:"•"; position:absolute; left:2px;
    color:var(--notice-accent); font-weight:700;
  }
  .notice li strong{ color:var(--notice-title); }
  .notice li time{ color:#b08a5a; font-size:16px; margin-left:6px; }
  .notice .close{
    float:right; border:none; background:transparent;
    color:var(--notice-accent); font-size:16px; cursor:pointer;
    padding:0 2px; line-height:1;
  }
  .notice .close:hover{ color:var(--notice-title); }

  /* 卡片网格 */
  .grid{
    max-width:1080px; margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:20px;
  }
  .card{
    position:relative; display:block;
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:22px;
    box-shadow:var(--shadow);
    text-decoration:none; color:inherit;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-hover); }
  .card .icon{ font-size:34px; line-height:1; }
  .card h3{ margin-top:14px; font-size:18px; font-weight:700; }
  .card p{ color:var(--muted); font-size:13px; line-height:1.6; margin-top:8px; }
  .card .tag{
    display:inline-block; margin-top:12px; padding:3px 10px;
    background:var(--primary-soft); color:var(--primary);
    border-radius:6px; font-size:12px; font-weight:600;
  }
  .card .go{
    position:absolute; top:22px; right:20px;
    color:var(--muted); font-size:18px; opacity:0; transition:opacity .18s;
  }
  .card:hover .go{ opacity:1; color:var(--primary); }
  /* 页脚 */
  .footer{ text-align:center; color:var(--muted); font-size:13px; margin-top:48px; }
</style>
</head>
<body>

  <div class="hero">
    <h1>📚 大屈老师的历史小站</h1>
    <p>初中历史教学 · 交互式页面合集</p>
    <span class="badge">持续更新中</span>
  </div>

  <!-- ========== 新增：通知栏（可关闭） ========== -->
  <div class="notice" id="notice">
    <button class="close" onclick="document.getElementById('notice').style.display='none'">✕</button>
    <div class="notice-head">通知栏</div>
    <ul>
      <li><strong>提醒：</strong>下周将安排月考，考试范围是九上1—18课，请同学们认真复习迎考<time>（2026.10.08）</time></li>
      <!-- 后续需要添加的内容在此继续添加，例如：<li><strong>作业布置：</strong>国庆假期请完成「九上填空默写」第 1–2 章<time>（10.04）</time></li>-->
    </ul>
  </div>

  <div class="grid" id="grid"><!-- 卡片由 JS 生成 --></div>

  <div class="footer">© 大屈老师的历史小站 · 由腾讯 ima 辅助构建</div>

<script>
/* ======== 在这里管理所有页面入口 ========
   新增页面时，只需在 pages 数组里加一个对象：
   {
     icon:  "页面图标（可用 Emoji）",
     title: "页面标题",
     desc:  "一句话描述",
     href:  "对应 html 文件名",
     tag:   "标签文字（可选）"
   }
*/
var pages = [
  { icon:"🚩", title:"国庆假期填空", desc:"九年级上册专题复习填空", href:"gqjqtk.html", tag:"练习" },
  { icon:"✏️", title:"九上填空默写", desc:"九年级上册填空式默写", href:"jstkmx.html", tag:"默写" },
  { icon:"📄", title:"九上复习提纲", desc:"左栏是中国史，右栏是同一时期的世界史，看清同时代的中外对照", href:"sjz.html", tag:"复习" }, 
  { icon:"⌚️", title:"中外历史时间轴", desc:"", href:"jsfxtg.html", tag:"复习" }, 
  // ↓ 后续生成的 html 页面在此继续添加，例如：
  // { icon:"🌍", title:"世界古代史练习", desc:"专项刷题", href:"world-ancient.html", tag:"练习" },
  // { icon:"⚙️", title:"世界近代史练习", desc:"专项刷题", href:"world-modern.html", tag:"练习" },
];

var grid = document.getElementById("grid");
pages.forEach(function(p){
  var a = document.createElement("a");
  a.className = "card";
  a.href = p.href;
  a.innerHTML =
    '<span class="icon">'+p.icon+'</span>'+
    '<h3>'+p.title+'</h3>'+
    '<p>'+p.desc+'</p>'+
    (p.tag ? '<span class="tag">'+p.tag+'</span>' : '')+
    '<span class="go">→</span>';
  grid.appendChild(a);
});
</script>
</body>
</html>
